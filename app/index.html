<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Agent Console</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--ink:#16181d;--muted:#5c6370;--line:#e2e5ea;--soft:#eef1f5;
  --accent:#2f5bd3;--pass:#1d7a46;--pass-bg:#e5f4ec;--fail:#b42318;--fail-bg:#fdecea;--hold:#9a6700;--hold-bg:#fff4d6;
  --off:#8a919c;--off-bg:#f0f1f3;
  --person:#7a3fb5;--rules:#3c4656;--writer:#c2410c;--gem:#2f6fd0;--jev:#2f5bd3;--judge2:#0f766e;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317;--panel:#1a1d23;--ink:#e8eaee;--muted:#a0a7b3;--line:#2c3038;--soft:#22262d;
  --accent:#7d9cff;--pass:#5fd394;--pass-bg:#173326;--fail:#ff8a7a;--fail-bg:#3a1c19;--hold:#f2c14e;--hold-bg:#3a3018;
  --off:#7f8693;--off-bg:#23262c;--person:#c79bf0;--rules:#b7c0ce;--writer:#ff9b66;--jev:#7d9cff;--judge2:#4fd1bf;}}
:root[data-theme="dark"]{
  --bg:#111317;--panel:#1a1d23;--ink:#e8eaee;--muted:#a0a7b3;--line:#2c3038;--soft:#22262d;
  --accent:#7d9cff;--pass:#5fd394;--pass-bg:#173326;--fail:#ff8a7a;--fail-bg:#3a1c19;--hold:#f2c14e;--hold-bg:#3a3018;
  --off:#7f8693;--off-bg:#23262c;--person:#c79bf0;--rules:#b7c0ce;--writer:#ff9b66;--jev:#7d9cff;--judge2:#4fd1bf;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
header{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0 8px 0 0}
.hrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled,button.primary:disabled{background:var(--soft);border-color:var(--line);color:var(--muted);opacity:1;cursor:not-allowed}
.spacer{flex:1}.muted{color:var(--muted)}.small{font-size:12px}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 58px)}
aside{border-right:1px solid var(--line);background:var(--panel);padding:12px;overflow:auto}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:4px 0 8px}
.run{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--panel)}
.run.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
main{padding:16px;overflow:auto;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--muted)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.p-pass{color:var(--pass);background:var(--pass-bg)}.p-fail{color:var(--fail);background:var(--fail-bg)}
.p-hold{color:var(--hold);background:var(--hold-bg)}.p-off{color:var(--off);background:var(--off-bg)}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid currentColor;margin-right:4px}
.c-reasoning{color:var(--writer)}.c-person{color:var(--person)}.c-rules{color:var(--rules)}.c-writer{color:var(--gem)}.c-jev{color:var(--jev)}.c-judge2{color:var(--judge2)}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;position:relative}
.step .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--soft);border:1px solid var(--line)}
.step.done .num{background:var(--pass-bg);color:var(--pass);border-color:var(--pass)}
.step.nb .num{color:var(--off)}.step.nb .card{opacity:.6;border-style:dashed}
.step:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:-12px;border-left:2px solid var(--line)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:2px 10px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;background:var(--soft)}
.tablewrap{overflow-x:auto}
.bar{height:6px;background:var(--soft);border-radius:3px;position:relative;min-width:80px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.hero{border-left:3px solid var(--line);padding-left:10px;margin:6px 0}
.hero .h{display:block;font-weight:600;font-size:15px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--soft);padding:12px;border-radius:8px;font:12px/1.45 ui-monospace,Menlo,monospace;max-height:70vh;overflow:auto}
img.pair{width:100%;border:1px solid var(--line);border-radius:8px;margin-top:8px}
.banner{padding:10px 12px;border-radius:8px;margin-bottom:12px}
.md h1{font-size:20px}.md h2{font-size:16px;margin-top:20px}.md p{max-width:80ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside{border-right:none;border-bottom:1px solid var(--line);max-height:220px}.grid2{grid-template-columns:1fr}}
@media (max-width:480px){header{padding:10px 16px}main{padding:16px}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>Website agent console</h1>
    <label class="small muted">Page <select id="page"></select></label>
    <label class="small muted">Industry <select id="industry" style="max-width:240px"></select></label>
    <label class="small muted">Buyer <select id="persona" style="max-width:260px"></select></label>
    <span class="spacer"></span>
    <span id="status" class="pill p-off">idle</span>
    <button id="theme" title="Switch light or dark">◐</button>
  </div>
  <div class="hrow">
    <label class="small muted">Goal <select id="goal" style="max-width:300px"></select></label>
    <button id="go" class="primary">Start a run</button>
    <span id="runnote" class="small muted"></span>
  </div>
  <div id="setupnote" class="banner small" style="display:none;margin:0"></div>
</header>
<div class="layout">
  <aside>
    <h2>Runs</h2>
    <div id="runs"><p class="muted small">Loading…</p></div>
  </aside>
  <main>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </main>
</div>
<script>
"use strict";
const S = {mode: "live", page: null, run: null, tab: "setup", pages: null, models: [], runs: [], capture: null, info: null, qs: null, poll: null, lastLog: ""};
const TABS = [["setup","Page setup"],["pipeline","Pipeline"],["audit","Audit"],["dossier","Gap dossier"],["variants","Variants"],["approve","Approve and test"],["findings","Sandbox and findings"],["submission","Submission and docs"],["questions","Judge questions"],["log","Run log"]];
const WHO = {person:"Person", rules:"Rules", reasoning:"Reasoning (Gemini)", writer:"Writer (Opus)", jev:"Jev", judge2:"Judge 2"};
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("#theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const nxt = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nxt;
  try { localStorage.setItem("theme", nxt); } catch (e) {}
};

function staticUrl(path, q) {
  if (path === "/api/pages") return "data/pages.json";
  if (path === "/api/runs") return `data/runs__${q.page}.json`;
  if (path === "/api/run") return `data/run__${q.page}__${q.run}.json`;
  if (path === "/api/questions") return `data/questions__${q.page}.json`;
  return null;
}
async function api(path, q = {}) {
  let url = S.mode === "static" ? staticUrl(path, q) : path + "?" + new URLSearchParams(q);
  const r = await fetch(url, {cache: "no-store"});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
}
function fileUrl(name, opts = {}) {
  if (S.mode === "static") return opts.capture ? `files/${S.page}/${opts.capture}/${name}` : `files/${S.page}/${S.run}/${opts.sub ? opts.sub + "/" : ""}${name}`;
  const q = {page: S.page, name}; if (opts.capture) q.capture = opts.capture; else q.run = S.run; if (opts.sub) q.sub = opts.sub;
  return "/api/file?" + new URLSearchParams(q);
}
function pill(v) {
  v = String(v || "");
  const base = v.replace("advisory-", "");
  const cls = base === "pass" ? "p-pass" : base === "fail" ? "p-fail" : base === "hold" ? "p-hold" : "p-off";
  return `<span class="pill ${cls}" title="${v.startsWith("advisory") ? "Advisory: informs, never blocks" : ""}">${esc(v || "n/a")}</span>`;
}
function band(b) {
  if (!b) return '<span class="muted">no band (advisory)</span>';
  const a = b.advisory ? ' <span class="muted">advisory</span>' : "";
  return b.polarity === "bad" ? `flag ≥ ${b.flag_at?.toFixed(2)}, clean ≤ ${b.clean_at?.toFixed(2)}${a}` : `pass ≥ ${b.pass_at?.toFixed(2)}, fail ≤ ${b.fail_at?.toFixed(2)}${a}`;
}
function bandKey(k) { return k.startsWith("A7") ? "A7-checklist-item" : k; }
function runTime(r) { const m = r.match(/(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/); return m ? `${m[3]}/${m[2]} ${m[4]}:${m[5]}` : r; }

function ownerCode(ask) {
  let t = ""; try { t = sessionStorage.getItem("ownerCode") || ""; } catch (e) {}
  if (!t && ask && S.hosted) { t = (prompt("Page setup on the website needs the owner code. Enter it (it stays in this browser tab only):") || "").trim(); try { if (t) sessionStorage.setItem("ownerCode", t); } catch (e) {} }
  return t;
}
function postHeaders(owner) { const h = {"Content-Type": "application/json", "X-Agent-Console": "1"}; const t = ownerCode(owner); if (t) h["X-Owner-Token"] = t; return h; }
async function postJob(url, body) {
  // A website job runs inside the request (about 3 minutes), so watch the log while it works.
  const req = fetch(url, {method: "POST", headers: postHeaders(url.startsWith("/api/setup")), body: JSON.stringify(body)});
  if (S.hosted) { S.tab = "log"; render(); S.wasRunning = true; setTimeout(pollStatus, 2500); }
  let r = null, j = null;
  try { r = await req; j = await r.json(); } catch (e) { j = null; }
  // On the website the connection can close before a long job ends; the job keeps running and the log keeps updating.
  if (!r || j === null || r.status >= 500) { if (!S.hosted) alert("The request failed. Check the log."); pollStatus(); return; }
  if (!r.ok) { if (S.hosted && r.status === 403) { try { sessionStorage.setItem("ownerCode", ""); } catch (e) {} } S.wasRunning = false; alert(j.error); }
  else if (!S.hosted) { S.tab = "log"; render(); }
  pollStatus();
}

async function init() {
  let p;
  const local = ["127.0.0.1", "localhost"].includes(location.hostname);
  if (!local) { S.mode = "static"; try { const r = await fetch("/api/live", {cache: "no-store"}); if (r.ok) { S.hosted = await r.json(); S.mode = "live"; } } catch (e) {} }
  if (local && location.port === "8790") { try { const r = await fetch("/api/live"); if (r.ok) S.hosted = await r.json(); } catch (e) {} }
  try { p = await api("/api/pages"); } catch (e) { S.mode = "static"; p = await api("/api/pages"); }
  S.mode = p.mode; S.pages = p.pages; S.models = p.models;
  if (S.mode === "static") { $("#go").style.display = "none"; $("#persona").parentElement.style.display = "none"; $("#industry").parentElement.style.display = "none"; $("#goal").parentElement.style.display = "none"; $("#status").textContent = "read-only copy"; $("#runnote").innerHTML = 'Read-only copy of finished runs. <a href="https://github.com/jtrnjn271994-cloud/sarvam-website-agent" target="_blank" rel="noopener">Run the agent yourself (GitHub)</a>'; }
  $("#page").innerHTML = S.pages.map(x => `<option value="${esc(x.slug)}">${esc(x.name)}</option>`).join("");
  $("#page").onchange = () => loadPage($("#page").value);
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button class="tab" data-k="${k}">${l}</button>`).join("");
  $("#tabs").onclick = e => { const k = e.target.dataset.k; if (k) { S.tab = k; render(); } };
  $("#go").onclick = startRun;
  $("#industry").onchange = async () => { fillRoles(); suggestGoal(); remember(); await refreshSetup(); render(); };
  $("#persona").onchange = async () => { suggestGoal(); remember(); await refreshSetup(); render(); };
  $("#goal").onchange = () => { remember(); updateGo(); };
  await loadPage(S.pages[0]?.slug);
  if (S.hosted) $("#runnote").textContent = "Website mode: one run at a time, up to $" + S.hosted.max_run_usd.toFixed(2) + " a run, " + S.hosted.runs_per_visitor_per_day + " runs a day per visitor. No screenshots; sarvam.ai is never loaded.";
  if (S.mode === "live") pollStatus();
}
async function loadPage(slug, pick) {
  S.page = slug; S.pageInfo = S.pages.find(x => x.slug === slug) || {};
  const r = await api("/api/runs", {page: slug});
  S.runs = r.runs; S.capture = r.capture;
  if (S.mode === "live") { S.opts = await api("/api/options", {page: slug}); fillSelectors(); }
  await refreshSetup();
  const last = S.runs.find(x => x.complete);
  $("#runnote").textContent = last ? `last run $${(last.cost_usd || 0).toFixed(2)} · ${last.calls} calls` : "";
  $("#runs").innerHTML = S.runs.length ? S.runs.map(x => `<button class="run" data-r="${esc(x.run)}">
      <div><b>${esc(runTime(x.run))}</b> <span class="muted small">${esc(x.run)}</span></div>
      <div class="small muted">${x.complete ? `$${(x.cost_usd || 0).toFixed(3)} · ${x.calls} calls · ${x.variants} variants` : "stopped early or running"}</div>
      <div class="small">${x.passed.length ? `passed: <b>${esc(x.passed.join(", "))}</b>` : '<span class="muted">no variant passed</span>'}</div>
      <div class="small muted">${esc((x.writer || "").split("/").pop())}${x.persona ? " · " + esc(x.persona) : ""}${x.goal ? " · " + esc(x.goal) : ""}</div></button>`).join("") : '<p class="muted small">No runs yet.</p>';
  $("#runs").onclick = e => { const b = e.target.closest(".run"); if (b) selectRun(b.dataset.r); };
  await selectRun(pick || S.runs[0]?.run);
}
async function selectRun(run) {
  if (run && !(S.runs || []).some(x => x.run === run)) run = S.runs?.[0]?.run;   // a run from a page that is no longer selected
  S.run = run;
  document.querySelectorAll(".run").forEach(b => b.classList.toggle("sel", b.dataset.r === run));
  S.info = run ? await api("/api/run", {page: S.page, run}) : null;
  render();
}
function render() {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.k === S.tab));
  const v = $("#view");
  let body;
  if (S.tab === "submission") body = viewSubmission();
  else if (S.tab === "questions") body = viewQuestions();
  else if (S.tab === "setup") body = viewSetup();
  else if (S.tab === "log") body = viewLog();
  else if (!S.info) body = pageCard();
  else body = {pipeline: viewPipeline, audit: viewAudit, dossier: viewDossier, variants: viewVariants, approve: viewApprove, findings: viewFindings}[S.tab]();
  v.innerHTML = guide() + body;
  if (S.tab === "setup") wireSetup();
  if (S.tab === "submission") wireSubmission();
  if (S.tab === "approve" && S.info) wireApprove();
  if (S.tab === "findings" && S.info) { wireFindings(); drawRunFlow(); }
  const gb = document.getElementById("guidego"); if (gb) gb.onclick = () => { S.tab = gb.dataset.tab; render(); };
}

function docUrl(k) { return S.mode === "static" ? `files/_docs/${k}${k === "architecture-html" ? ".html" : ".md"}` : "/api/doc?name=" + k; }
function tick(ok, label, where) { return `<tr><td>${ok ? '<span class="pill p-pass">done</span>' : '<span class="pill p-off">not yet</span>'}</td><td>${label}</td><td class="small muted">${where}</td></tr>`; }
function viewSubmission() {
  const p = S.info?.probe || {}, f = S.info?.files || [], sb = S.info?.sandbox, C = S.info?.current_approval;
  const rows = S.info ? [
    tick(!!S.capture, "The live hero was captured once (text and screenshot)", "Audit tab"),
    tick(!!p.audit, "The hero was audited with Jev, question by question", "Audit tab"),
    tick(f.includes("GAP-DOSSIER.md"), "The gaps were explained for this buyer", "Gap dossier tab"),
    tick((p.variants || []).length > 0, "Three variants were written, with a claim map", "Variants tab"),
    tick(!!p.gate1_rounds, "Gate 1 (rules) checked every variant", "Variants tab"),
    tick(!!p.gate2 && Object.keys(p.gate2).length > 0, "Gate 2: Jev and Judge 2 scored every variant that passed Gate 1", "Variants tab"),
    tick(f.some(x => x.startsWith("pair-")), "Side-by-side screenshots of live and variant", "Approve and test tab"),
    tick(!!C, "A person approved one variant", "Approve and test tab"),
    tick(!!sb, "The sandbox ran on the approved variant", "Approve and test tab"),
    tick(!!sb, "The findings were written, with the set-up of the simulation", "Sandbox and findings tab"),
  ].join("") : "";
  return `<div class="card"><b>${S.info ? "This run's deliverables" : "No run selected"}</b>
      ${S.info ? `<div class="tablewrap"><table><tr><th>Status</th><th>Step</th><th>Where</th></tr>${rows}</table></div>` : '<p class="small muted">Pick a run on the left to see what it produced. The project documents below do not depend on a run.</p>'}</div>
    <div class="card md" id="doc-readme"><b>README</b><p class="muted small">Loading…</p></div>
    <div class="card"><b>Architecture</b> <a class="small" href="${docUrl("architecture-html")}" target="_blank" rel="noopener">open in a new tab</a>
      <iframe src="${docUrl("architecture-html")}" title="Architecture" style="width:100%;height:720px;border:1px solid var(--line);border-radius:8px;margin-top:8px;background:#fff"></iframe></div>
    <div class="card md" id="doc-jev"><b>Where Jev fits</b><p class="muted small">Loading…</p></div>`;
}
function wireSubmission() {
  [["readme", "doc-readme"], ["jev", "doc-jev"]].forEach(([k, id]) => fetch(docUrl(k)).then(r => r.ok ? r.text() : "Not available.").then(t => { const el = document.getElementById(id); if (el) el.innerHTML = mdToHtml(t); }));
}
function pageCard() {
  const P = S.pageInfo || {}, c = S.capture;
  return `<div class="card"><b>${esc(P.name)}</b> <span class="pill ${P.ready ? "p-pass" : "p-hold"}">${P.ready ? "setup approved" : "setup not approved"}</span>
    <div class="kv" style="margin-top:8px"><div>Address</div><div>${esc(P.url)}</div><div>Layer</div><div>${esc(P.layer || "")}</div>
    <div>Search visits</div><div>${esc(P.traffic_in || "n/a")} <span class="muted small">(Semrush, Google India, estimated monthly)</span></div><div>Status</div><div>${esc(P.status || "")}</div></div>
    ${c ? `<div class="hero" style="margin-top:10px"><span class="h">${esc(c.h1)}</span>${esc(c.sub)}<div class="small">Main button: <b>${esc((c.ctas || []).find(x => x.href)?.text)}</b> → ${esc((c.ctas || []).find(x => x.href)?.href)}</div></div>
      <img class="pair" alt="Saved hero of ${esc(P.name)}" src="${fileUrl("hero-desktop.png", {capture: c.folder})}"><p class="small muted">Saved ${esc(c.captured_at)}. Loaded once; runs use this saved copy.</p>` : '<p class="muted">Not captured yet.</p>'}
    ${P.ready ? '<p class="small">No run selected. Start a run, or pick one on the left.</p>' : '<p class="small">A run needs the page setup approved first: open the Page setup tab.</p>'}</div>`;
}
function stepResult(n, p) {
  const a = p.audit || {}, g = p.gate2 || {}, vs = p.variants || [];
  const files = S.info.files;
  switch (n) {
    case "1": return `Page folder <b>${esc(S.page)}</b>. Buyer, goal and test type come from brief.json.`;
    case "2": return S.capture ? `Live hero captured ${esc(S.capture.captured_at || S.capture.folder)}. Loaded once; no bot traffic to the live site.<div class="hero"><span class="h">${esc(S.capture.h1)}</span>${esc(S.capture.sub)}</div>` : "No capture found.";
    case "3": return "Saved positioning used. No model call in this run.";
    case "4": return a.p ? `Gaps: ${(a.gaps || []).length ? a.gaps.map(k => `<b>${esc(k)}</b>`).join(", ") : "none"}. ` +
      (a.lead_txt ? `Buyer question answered worst: “${esc(a.lead_txt)}”. ` : "") +
      (p.page_questions && !p.page_questions.approved ? `<span class="pill p-hold">page questions not approved: A7 and A8 skipped</span>` : "") : "Not reached.";
    case "5": return p.dossier ? `${p.dossier.text.split(/\s+/).length} words. Prose check problems left: ${p.dossier.prose_problems_left?.length ? esc(p.dossier.prose_problems_left.join("; ")) : "none"}.` : "Not reached.";
    case "6": return "Not built yet: the test plan is not locked with a hash.";
    case "7": return vs.length ? `${vs.length} variants. Gate 1 rounds: ${(p.gate1_rounds || []).length}.` : "Not reached.";

function mdToHtml(md) {

    out += `<div class="tablewrap"><table><tr>${rows[0].map(c => `<th>${inl(c)}</th>`).join("")}</tr>${rows.slice(1).map(r => `<tr>${r.map(c => `<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</table></div>`; tbl = []; };
  let code = null;
  for (const l of lines) {
    if (l.startsWith("```")) { if (code === null) { flush(); code = []; } else { out += `<pre>${esc(code.join("\n"))}</pre>`; code = null; } continue; }
    if (code !== null) { code.push(l); continue; }
    if (l.startsWith("|")) { tbl.push(l.trim()); continue; } flush();
    if (/^### /.test(l)) out += `<h3>${inl(l.slice(4))}</h3>`; else if (/^## /.test(l)) out += `<h2>${inl(l.slice(3))}</h2>`;
    else if (/^# /.test(l)) out += `<h1>${inl(l.slice(2))}</h1>`; else if (/^- /.test(l)) out += `<li>${inl(l.slice(2))}</li>`; else if (/^\d+\. /.test(l)) out += `<li>${inl(l.replace(/^\d+\. /, ""))}</li>`;
    else if (l.trim()) out += `<p>${inl(l)}</p>`;
  }
  flush(); return out;
}

    const body = {page: S.page, run: S.run, variant: box.dataset.v, decision: b.dataset.d,
      name: box.querySelector(".nm").value, reason: box.querySelector(".rs").value, note: box.querySelector(".nt").value};
    const r = await fetch("/api/approve", {method: "POST", headers: postHeaders(), body: JSON.stringify(body)});
    const j = await r.json();
    if (!r.ok) { box.querySelector(".msg").textContent = j.error; box.querySelector(".msg").style.color = "var(--fail)"; return; }
    await selectRun(S.run);
  });
  document.querySelectorAll(".ed button").forEach(b => b.onclick = async () => {
    const box = b.closest(".ed"), words = b.dataset.k === "words";
    const body = {page: S.page, run: S.run, variant: box.dataset.v};
    if (words) Object.assign(body, {h1: box.querySelector(".eh1").value, sub: box.querySelector(".esub").value, cta: box.querySelector(".ecta").value});
    else { body.note = box.querySelector(".enote").value.trim(); if (body.note.length < 5) return alert("Write a short note for the writer first."); }
    if (!confirm("Check this edit with Gate 1 and both judges? It costs about $0.05 to $0.15 and takes about a minute.")) return;
    await postJob("/api/edit", body);
  });
  const sbx = document.getElementById("sbx");
  if (sbx) sbx.onclick = async () => {
    await postJob("/api/sandbox", {page: S.page, run: S.run});
  };
}


function remember() { try { localStorage.setItem("sel:" + S.page, JSON.stringify({persona: $("#persona").value, goal: $("#goal").value})); } catch (e) {} }
function fillSelectors() {
  const o = S.opts; let saved = {}; try { saved = JSON.parse(localStorage.getItem("sel:" + S.page) || "{}"); } catch (e) {}
  $("#industry").innerHTML = o.industries.map(i => `<option value="${esc(i.id)}">${esc(i.name)}</option>`).join("");
  // default: the saved choice, else the first buyer that already has a checklist, else the best-fit industry
  const all = o.industries.flatMap(i => i.roles.map(r => Object.assign({ind: i.id}, r)));
  const pick = all.find(r => r.key === saved.persona) || all.find(r => r.checklist === "approved") || all.find(r => r.checklist !== "missing") || all[0];
  if (pick) $("#industry").value = pick.ind;
  fillRoles(pick && pick.key);
  suggestGoal();
  if (saved.goal && [...$("#goal").options].some(x => x.value === saved.goal && !x.disabled)) $("#goal").value = saved.goal;
}
function suggestedGoal() {
  const ind = (S.opts?.industries || []).find(i => i.id === $("#industry").value);
  return ind?.roles.find(r => r.key === $("#persona").value)?.suggested_goal || null;
}
function suggestGoal() {   // the goal list is built for the chosen buyer; the first one is the suggestion
  const ind = (S.opts?.industries || []).find(i => i.id === $("#industry").value);
  const r = ind?.roles.find(x => x.key === $("#persona").value);
  const goals = r?.goals || S.opts.goals;
  $("#goal").innerHTML = goals.map((g, i) => `<option value="${esc(g.id)}" ${g.available ? "" : "disabled"}>${esc(g.label)}${g.available ? "" : " (no link on this page)"}${i === 0 && r?.suggested_goal ? "  ← suggested" : ""}</option>`).join("");
  const first = goals.find(g => g.available); if (first) $("#goal").value = first.id;
}
function markGoal() {}
const CHK_WORD = {approved: " · checklist approved", draft: " · checklist drafted", changed: " · checklist changed", missing: ""};
function fillRoles(key) {
  const ind = (S.opts.industries || []).find(i => i.id === $("#industry").value) || {roles: []};
  $("#persona").innerHTML = ind.roles.map(r => `<option value="${esc(r.key)}">${esc(r.role)}</option>`).join("");
  if (key && ind.roles.some(r => r.key === key)) $("#persona").value = key;
}
async function refreshSetup() {
  const key = S.mode === "live" ? $("#persona").value : "";
  S.qs = await api("/api/questions", Object.assign({page: S.page}, key ? {persona: key} : {}));
  if (S.mode === "live") S.setup = await api("/api/setup", {page: S.page, persona: key});
  updateGo();
}
function updateGo(running) {
  if (S.mode !== "live") return;
  const st = S.setup?.status, g = (S.opts?.goals || []).find(x => x.id === $("#goal").value);
  const ok = st?.ready && g?.available && !running;
  $("#go").disabled = !ok;
  $("#go").title = !st?.ready ? "Approve the page setup first (Page setup tab)" : !g?.available ? "Pick a goal with a real link" : "";
  const n = $("#setupnote"), parts = st?.parts || {}, ck = parts["checklist:" + $("#persona").value];
  const need = ["positioning", "claims"].filter(k => parts[k] !== "approved").map(k => PART_LABEL[k]);
  if (!st) { n.style.display = "none"; return; }
  if (!st.ready) {
    n.style.display = ""; n.style.background = "var(--soft)"; n.style.borderLeft = "4px solid var(--hold, #c58a00)";
    n.innerHTML = `<b>${esc(S.pageInfo?.name || "This page")} is not set up yet.</b> Approve ${esc(need.join(" and "))} once in Page setup; after that anyone can run it for any buyer. <button id="setupgo">Open Page setup</button>`;
    document.getElementById("setupgo").onclick = () => { S.tab = "setup"; render(); };
  } else if (ck !== "approved") {
    n.style.display = ""; n.style.background = "var(--soft)"; n.style.borderLeft = "4px solid var(--line)";
    n.innerHTML = `Ready to run. This buyer's checklist is ${ck === "missing" ? "not drafted" : "not approved"}, so the run skips the two buyer questions (A7, A8). <button id="setupgo">Open Page setup</button>`;
    document.getElementById("setupgo").onclick = () => { S.tab = "setup"; render(); };
  } else n.style.display = "none";
}
const PART_LABEL = {positioning: "Positioning", claims: "Claims", checklist: "Buyer checklist"};
function stPill(v) {
  const c = v === "approved" ? "p-pass" : v === "missing" ? "p-off" : v === "changed" ? "p-fail" : "p-hold";
  return `<span class="pill ${c}">${esc(v === "draft" ? "waiting for approval" : v === "changed" ? "changed after approval" : v || "missing")}</span>`;
}
function decideBox(part) {
  return `<div class="sdec" data-part="${esc(part)}" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px">
    <input class="snote" placeholder="Only if rejecting: what should change? The agent uses this to redraft." style="flex:1;min-width:200px;font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)">
    <button class="primary" data-d="approve">Approve</button><button data-d="reject">Reject</button><span class="smsg small"></span></div>`;
}
function viewSetup() {
  if (S.mode !== "live") return '<div class="card muted">Page setup is done in the local console.</div>';
  const X = S.setup, key = $("#persona").value, parts = X.status.parts;
  const P = S.pageInfo || {}, missing = Object.values(parts).some(v => v === "missing");
  const hist = X.history.slice().reverse();
  const objection = X.checklist.text ? ((X.checklist.text.match(/main_objection: "(.*)"/) || [])[1] || "none") : "";
  return `<div class="card"><b>${esc(P.name)}</b> · buyer: <b>${esc($("#persona").selectedOptions[0]?.text || "")}</b> · goal: <b>${esc($("#goal").selectedOptions[0]?.text || "")}</b>
      <p class="small">A run needs the positioning and the claims approved. The buyer checklist turns on the buyer questions (A7) and the objection question (A8). The reasoning model drafts; code checks every quote word for word against the saved page; you approve.</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${Object.entries(parts).map(([k, v]) => `<span class="small">${esc(PART_LABEL[k.split(":")[0]])}</span> ${stPill(v)}`).join(" ")}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center"><input id="sname" placeholder="Name (optional, kept in the record)" maxlength="80" style="min-width:260px;font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)">
      ${missing ? `<button id="sdraft" class="primary">Let the agent draft ${esc(Object.entries(parts).filter(([k, v]) => v === "missing").map(([k]) => PART_LABEL[k.split(":")[0]].toLowerCase()).join(" and "))}</button><span class="small muted">The reasoning model writes it from the saved page and the buyer research (about a minute, about $0.05). Then you read it and click Approve.</span>` : ""}</div>
      ${S.setupFlash ? `<p class="small" style="margin-top:8px;color:var(--pass)"><b>${esc(S.setupFlash)}</b></p>` : ""}</div>
    <div class="card md"><div style="display:flex;gap:8px;align-items:center"><b>1. Positioning</b> ${stPill(parts.positioning)}</div>
      ${X.positioning.text ? `<div class="small muted">${esc(X.positioning.file)}</div>${(X.positioning.check || []).length ? `<div class="banner p-fail small"><b>Structure check: ${X.positioning.check.length} problem(s).</b> It cannot be approved until it follows the 12-section rule.<ul>${X.positioning.check.slice(0, 8).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : `<div class="small" style="color:var(--pass)">Structure check passed: all 12 sections, every bullet sourced and labelled.</div>`}${mdToHtml(X.positioning.text.replace(/^---[\s\S]*?---\n/, ""))}${decideBox("positioning")}` : '<p class="muted">Not drafted yet.</p>'}</div>
    <div class="card"><div style="display:flex;gap:8px;align-items:center"><b>2. Claims</b> ${stPill(parts.claims)} <span class="small muted">the writer may use only these</span></div>
      ${X.claims.length ? `<div class="tablewrap"><table><tr><th>Id</th><th>Claim</th><th>Exact words on the page</th><th>Keep</th></tr>${X.claims.map(c => `<tr><td>${esc(c.id)}</td><td>${esc(c.text)}</td><td class="small">“${esc(c.quotes.join(" | "))}”</td><td class="small">${esc(c.keep)}</td></tr>`).join("")}</table></div>
        ${X.claims_check?.dropped?.length ? `<details><summary class="small">${X.claims_check.dropped.length} draft claims dropped by the quote check</summary><ul class="small">${X.claims_check.dropped.map(d => `<li>${esc(d.text)}: ${esc(d.why.join("; "))}</li>`).join("")}</ul></details>` : `<p class="small muted">${X.claims_check ? "No draft claim was dropped by the quote check." : ""}</p>`}
        ${decideBox("claims")}` : '<p class="muted">Not drafted yet.</p>'}</div>
    <div class="card md"><div style="display:flex;gap:8px;align-items:center"><b>3. Buyer checklist</b> ${stPill(parts["checklist:" + key])}</div>
      ${X.checklist.text ? `<div class="small muted">${esc(X.checklist.file)}</div>${mdToHtml(X.checklist.text.replace(/^---[\s\S]*?---\n/, ""))}<p class="small">Main objection: <b>${esc(objection)}</b></p>${decideBox("checklist:" + key)}` : '<p class="muted">Not drafted yet for this buyer.</p>'}</div>
    ${hist.length ? `<details class="card"><summary class="small">Setup decisions (${hist.length})</summary><div class="tablewrap"><table><tr><th>When</th><th>Who</th><th>Part</th><th>Decision</th><th>Note</th></tr>${hist.map(e => `<tr><td>${esc(e.at)}</td><td>${esc(e.name)}</td><td>${esc(e.part)}</td><td>${esc(e.decision)}</td><td>${esc(e.note)}</td></tr>`).join("")}</table></div></details>` : ""}`;
}
function wireSetup() {
  const d = document.getElementById("sdraft");
  if (d) d.onclick = async () => {
    await postJob("/api/setup/draft", {page: S.page, persona: $("#persona").value});
  };
  document.querySelectorAll(".sdec button").forEach(b => b.onclick = async () => {
    const box = b.closest(".sdec");
    const body = {page: S.page, persona: $("#persona").value, part: box.dataset.part, decision: b.dataset.d, name: $("#sname").value, note: box.querySelector(".snote").value};
    const r = await fetch("/api/setup/approve", {method: "POST", headers: postHeaders(true), body: JSON.stringify(body)});
    const j = await r.json();
    if (!r.ok) { box.querySelector(".smsg").textContent = j.error; box.querySelector(".smsg").style.color = "var(--fail)"; alert(j.error); return; }
    const nm = $("#sname").value; await refreshSetup();
    const left = Object.entries(S.setup.status.parts).filter(([k, v]) => v !== "approved").map(([k]) => PART_LABEL[k.split(":")[0]]);
    S.setupFlash = (b.dataset.d === "approve" ? "Approved: " : "Rejected: ") + PART_LABEL[box.dataset.part.split(":")[0]] + ". " +
      (S.setup.status.ready ? (left.length ? "Runs are now unlocked. Still open (optional): " + left.join(", ") + "." : "All three parts approved. Click Start a run at the top.") : "Still needed before a run: " + left.join(", ") + ".");
    render(); const n = document.getElementById("sname"); if (n) n.value = nm;
  });
}


function guide() {
  if (S.mode !== "live") return "";
  const st = S.setup?.status, C = S.info?.current_approval, sb = S.info?.sandbox;
  const step = (n, text, tab, label) => `<div class="banner p-hold" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><b>Next step ${n} of 5.</b> <span>${text}</span>${tab && S.tab !== tab ? `<button id="guidego" data-tab="${tab}">${label}</button>` : ""}</div>`;
  if (S.info && S.tab !== "setup") {   // a saved run is open: its own next step, whatever the setup state
    if (!C) return step(3, "Read the variants and their scores, then pick one and click “Approve for the sandbox”. (A new run on this page needs the page setup approved first.)", "approve", "Open Approve and test");
    if (!sb) return step(4, `Variant ${esc(C.variant)} is approved. Click “Run the sandbox” (no model cost, about a minute).`, "approve", "Open Approve and test");
    return `<div class="banner p-pass small">Done for this run: variant ${esc(sb.variant)} was approved and tested. Results are in “Sandbox and findings”.${S.tab !== "findings" ? ' <button id="guidego" data-tab="findings">Open Sandbox and findings</button>' : ""}</div>`;
  }
  if (!st?.ready) return step(1, "Approve Positioning and Claims once for this page (read each, click Approve). The buyer checklist is optional: it adds two buyer questions. After this, any buyer can be run without setup.", "setup", "Open Page setup");
  if (!S.info) return step(2, "Setup is approved. Click “Start a run” at the top right (about $0.20 and 3 to 5 minutes). The run log shows progress.", null);
  if (!C) return step(3, "Read the variants and their scores, then pick one and click “Approve for the sandbox”.", "approve", "Open Approve and test");
  if (!sb) return step(4, `Variant ${esc(C.variant)} is approved. Click “Run the sandbox” (no model cost, about a minute).`, "approve", "Open Approve and test");
  return `<div class="banner p-pass small">Done for this run: variant ${esc(sb.variant)} was approved and tested. Results are in “Sandbox and findings”.${S.tab !== "findings" ? ' <button id="guidego" data-tab="findings">Open Sandbox and findings</button>' : ""}</div>`;
}
function scoreTable(name) {
  const r = (S.info.probe.gate2 || {})[name];
  if (!r || !r.judge1) return "";
  const qs = Object.keys(r.judge1.audit_variant || {});
  const cell = (j, k) => { const J = r[j]; if (!J || J.audit_variant?.[k] === undefined) return "<td>-</td>";
    const b = J.audit_baseline[k], v = J.audit_variant[k], d = J.delta[k];
    return `<td>${b.toFixed(2)} → <b>${v.toFixed(2)}</b> <span class="pill ${d >= 0.1 ? "p-pass" : d < -0.05 ? "p-fail" : "p-off"}">${d >= 0 ? "+" : ""}${d.toFixed(2)}</span></td>`; };
  const kind = k => (r.judge1.targeted || []).includes(k) ? "gap" : "other";
  const g3 = j => r[j] ? `${r[j].G3?.toFixed(2)} (${esc(r[j].G3_verdict)})` : "-";
  const rule = S.qs?.better_than_baseline || {};
  return `<details class="card" style="margin:8px 0" open><summary class="small"><b>How it was scored</b>: Gate 1 rules, then both judges</summary>
    <p class="small">Gate 1 (rules, no model): ${(((S.info.probe.gate1_rounds || []).slice(-1)[0] || {})[name] || []).length ? "failed" : "passed"}. Gate 2: each judge answered every audit question for the live hero and for this variant. A higher number means “more yes”; for A6 (rival could copy it) lower is better, so its change is shown with the sign flipped.
    Rule: average change on the “gap” rows must be at least +${rule.min_gain}, and no “other” row may drop more than ${rule.max_drop}.</p>
    <div class="tablewrap"><table><tr><th>Question</th><th>Row</th><th>Jev: live → variant (change)</th><th>Judge 2: live → variant (change)</th></tr>
    ${qs.map(k => `<tr><td>${esc(k)}</td><td>${kind(k)}</td>${cell("judge1", k)}${cell("judge2", k)}</tr>`).join("")}
    <tr><td>Banned-phrase check</td><td>flag</td><td>${g3("judge1")}</td><td>${g3("judge2")}</td></tr>
    <tr><td><b>Better than the live hero?</b></td><td></td><td>${r.judge1.better ? pill("pass") : pill("fail")}</td><td>${r.judge2.better ? pill("pass") : pill("fail")}</td></tr></table></div></details>`;
}

function mmEsc(t, n) { t = String(t ?? "").replace(/["<>{}\[\]|#;]/g, " ").replace(/\s+/g, " ").trim(); return n && t.length > n ? t.slice(0, n - 1) + "…" : t; }
async function runFlowText() {
  // Built by agent/run_flow.py from the run's own files: one script for every run, same steps as the architecture.
  if (S.mode === "static") { const t = await (await fetch(fileUrl("RUN-FLOW.md"))).text(); const m = t.match(/```mermaid\n([\s\S]*?)```/); if (!m) throw new Error("no diagram for this run"); return m[1]; }
  const r = await fetch("/api/runflow?" + new URLSearchParams({page: S.page, run: S.run}), {cache: "no-store"});
  if (!r.ok) throw new Error("diagram not available");
  return await r.text();
}
function loadMermaid() {
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (S.mmP) return S.mmP;
  S.mmP = new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    sc.onload = () => { window.mermaid.initialize({startOnLoad: false, securityLevel: "strict"}); ok(window.mermaid); }; sc.onerror = no; document.head.appendChild(sc); });
  return S.mmP;
}
function drawRunFlow() {
  const el = document.getElementById("runflow"); if (!el || !S.info) return;
  Promise.all([loadMermaid(), runFlowText()]).then(([m, t]) => m.render("rf" + Date.now(), t)).then(r => { const e2 = document.getElementById("runflow"); if (e2) e2.innerHTML = r.svg; })
    .catch(e => { const e2 = document.getElementById("runflow"); if (e2) e2.innerHTML = '<p class="small muted">The diagram could not be drawn (' + esc(e.message || "no network") + ').</p>'; });
}
const RUNFLOW_CARD = `<div class="card"><b>This run, step by step</b> <span class="small muted">same 12 steps as the architecture; grey dashed = not reached yet</span><div id="runflow" style="overflow-x:auto;margin-top:8px"><p class="small muted">Drawing…</p></div></div>`;
function viewFindings() {
  const sb = S.info.sandbox, C = S.info.current_approval;
  if (!sb) return RUNFLOW_CARD + `<div class="card"><b>No sandbox result for this run yet.</b><p class="small">${C ? `Variant ${esc(C.variant)} is approved. Open “Approve and test” and click “Run the sandbox”.` : "No variant of this run has been approved. Open “Approve and test”, pick a variant and approve it, then run the sandbox."} The sandbox and findings exist only for runs where a person approved a variant.</p>
    <p class="small muted">Submission files: README.md, docs/architecture.md and submission/JEV-NOTE.md in the project folder.</p></div>`;
  return RUNFLOW_CARD + `<div class="card"><b>Sandbox</b> <span class="pill p-off">SYNTHETIC</span> · variant ${esc(sb.variant)} · approved by ${esc(sb.approval.name)} ${sb.approval.override ? "(chosen against a Gate 2 result)" : ""}${sandboxTable(sb)}</div>
    <div class="card md" id="fnd2">Loading findings…</div>
    <div class="card small muted">Submission files: README.md, docs/architecture.md and submission/JEV-NOTE.md in the project folder.</div>`;
}
function wireFindings() {
  if (S.info.sandbox) fetch(fileUrl("FINDINGS.md", {sub: "sandbox"})).then(r => r.text()).then(t => { const el = document.getElementById("fnd2"); if (el) el.innerHTML = mdToHtml(t); });
}

async function startRun() {
  const msg = S.hosted ? "Start a run on " + S.page + "? It calls the writer and both judges through OpenRouter (about $0.25 to $0.50, capped at $" + S.hosted.max_run_usd.toFixed(2) + "). It takes about 3 minutes; keep this tab open. No screenshots are taken on the website."
    : "Start a live run on " + S.page + "? It calls the writer and both judges through OpenRouter. The live page is loaded once for the PNGs.";
  if (!confirm(msg)) return;
  await postJob("/api/start", {page: S.page, persona: $("#persona").value, goal: $("#goal").value});
}
async function pollStatus() {
  clearTimeout(S.poll);
  let st; try { st = await api("/api/status"); } catch (e) { return; }
  S.lastLog = st.log || S.lastLog;
  updateGo(st.running);
  $("#status").className = "pill " + (st.running ? "p-hold" : st.exit_code === 0 ? "p-pass" : st.exit_code ? "p-fail" : "p-off");
  $("#status").textContent = st.running ? "running…" : st.exit_code === 0 ? "last run finished" : st.exit_code ? `last run failed (${st.exit_code})` : "idle";
  const box = document.getElementById("logbox");
  if (box) { const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 20; box.textContent = S.lastLog || "No run started from this console yet."; if (atEnd) box.scrollTop = box.scrollHeight;
    document.getElementById("logmeta").textContent = st.started ? `Run on ${st.page} started ${st.started}. Spend cap per run: $${st.spend_cap_usd.toFixed(2)}.` : `Spend cap per run: $${st.spend_cap_usd.toFixed(2)}.`; }
  updateGo(st.running);
  if (st.running) S.poll = setTimeout(pollStatus, 2000);
  else if (S.wasRunning) { S.wasRunning = false; if (st.kind === "sandbox" || st.kind === "edit") S.tab = "approve"; if (st.kind === "setup") S.tab = "setup"; await loadPage(st.page || S.page, st.kind === "setup" ? S.run : st.new_run); }
  if (st.running) S.wasRunning = true;
}
init().catch(e => { $("#view").innerHTML = `<div class="card">Could not load: ${esc(e.message)}</div>`; });
</script>
